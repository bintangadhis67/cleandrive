name: cleandrive
description: Aplikasi booking dan tracking antrean cuci kendaraan.
publish_to: none
version: 1.3.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  qr_flutter: ^4.1.0
  pdf: ^3.10.8
  printing: ^5.12.0
  intl: any
  google_fonts: ^6.2.1
  mobile_scanner: ^7.2.1 # pemindai QR kamera (admin: Verifikasi Tiket)
  http: ^1.6.0
  shared_preferences: ^2.5.6
  image_picker: ^1.2.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/